name: CI

# Every push to main and every pull request is built and tested on all three
# desktop platforms. A push to main also publishes the binaries as the "latest"
# pre-release; a v* tag publishes them as a numbered release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A second push supersedes the first: cancel the run it overtook.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # What a build gets unless its matrix entry names another one, and what the
  # sanitizer jobs get. **6.8 is an LTS, and for an open-source project that
  # means frozen rather than maintained**: the newest 6.8 on Qt's download
  # server is 6.8.3, from April 2025, and every patch release after it is
  # commercial-only. So this is a version that cannot receive a fix, and the
  # Windows entry below is pinned past it because it needed one.
  QT_VERSION: '6.8.*'
  BUILD_TYPE: RelWithDebInfo

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the state of the other two.
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            generator: Ninja
          - name: windows
            os: windows-2022
            generator: Visual Studio 17 2022
            # Not QT_VERSION, and the only entry that departs from it. Qt's
            # windows11 style cut a QSlider's handle flat at both ends of its
            # travel until 6.10.1 -- QTBUG-140649, reported here as #75 -- and
            # the fix was never picked to 6.8. Nothing in this repository caused
            # it and nothing here could fix it.
            #
            # 6.10.3 is the newest Qt that can actually be installed here, and
            # the ceiling is the installer rather than Qt. `install-qt-action`
            # fetches through aqtinstall; its newest release is 3.3.0, from June
            # 2025, and 3.3.0 cannot read the repository layout Qt uses for 6.11
            # -- `aqt list-qt windows desktop --arch 6.11.2` errors while 6.10.3
            # answers. 6.11.2 was tried first and the job died before it built.
            # **Check that before raising this**, with those two commands; the
            # version being listed by `list-qt` is not enough.
            #
            # So the download runs 6.10 and a local build runs 6.11. That gap is
            # smaller than the one that hid #75 and it is not closed.
            #
            # Exact rather than 6.10.*, because a patch release arriving
            # unannounced is the shape of #75. 6.10 leaves Qt's standard support
            # in October 2026, which is a reason to revisit and not a reason to
            # stay on a version with the bug.
            #
            # Linux and macOS stay on 6.8: neither draws this control and
            # neither has a bug that a bump would fix. That they are frozen on a
            # dead-end Qt is real and is #82, not this.
            qt: '6.10.3'
          - name: macos
            os: macos-14
            generator: Ninja
            # Qt's macOS binaries are universal, so one build serves both Apple
            # Silicon and Intel and there is one Mac download rather than two.
            # The quotes matter: the list separator is a shell separator too.
            # 13.3 is where Apple's standard library grew the floating-point
            # to_chars, which the project file format is written with.
            extra_cmake: '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3'

    steps:
      - uses: actions/checkout@v7

      # Qt's own binaries need these at build time, and the offscreen platform
      # plugin the interface tests run under needs them at run time.
      - name: Install Linux dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libgl1-mesa-dev libglu1-mesa-dev \
            libfontconfig1 libfreetype6 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1

      - name: Install Ninja
        if: matrix.name == 'macos'
        run: brew install ninja

      # **qtmultimedia is a spike and not yet a dependency.** It is here so the
      # packaging steps below have something to bundle -- see the report step
      # after each of them, and docs/importing.md, "which library". Adding it to
      # the install is safe on its own; adding `Multimedia` to the root
      # find_package would not be, and nothing does.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt || env.QT_VERSION }}
          modules: qtmultimedia
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build
          -G "${{ matrix.generator }}"
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DANIMAGE_SANITIZE=OFF
          ${{ matrix.extra_cmake }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Test
        run: ctest --test-dir build --build-config ${{ env.BUILD_TYPE }} --output-on-failure

      # ---------------------------------------------------------------- package

      - name: Package (Linux AppImage)
        if: matrix.name == 'linux'
        run: |
          set -euo pipefail
          cmake --install build --prefix AppDir/usr
          install -Dm644 packaging/animage.desktop AppDir/usr/share/applications/animage.desktop
          install -Dm644 packaging/animage.svg AppDir/usr/share/icons/hicolor/scalable/apps/animage.svg

          base=https://github.com/linuxdeploy
          curl -fsSLO $base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSLO $base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-*.AppImage

          # Unpack rather than mount: the runners have no FUSE.
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export OUTPUT=Animage-linux-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage

          mkdir -p dist && mv "$OUTPUT" dist/

      # -------------------------------------------- what the package picked up
      #
      # Did the deployment tool bundle a multimedia backend, and what did that
      # add to the download. Only a packaged build on a runner can say, and it
      # is worth asking on every push rather than once: what it guards against
      # is a Qt or a packaging-tool change quietly dropping the backend, which
      # costs QAudioDecoder and so every compressed file somebody imports.
      #
      # **It asks by looking, which is less than the spike asked.** A plugin
      # sitting in the right folder and a plugin that loads are different facts,
      # and the second needed a flag inside the application to answer. That flag
      # was the spike and has come out with it -- see docs/audio-spike.md, "what
      # comes out again". Getting the second fact back is issue #87, which is
      # where what a silent failure costs a user is written out.
      #
      # Never `set -e` on the reporting: a step that exits on the first thing it
      # cannot find reports less than one that says what is missing.
      - name: What the AppImage got
        if: matrix.name == 'linux'
        run: |
          echo "--- size ---"
          ls -l dist/
          echo "--- multimedia in the AppDir ---"
          find AppDir \( -iname '*multimedia*' -o -iname 'libav*' -o -iname 'libsw*' \) \
            | sort | xargs -r ls -l || echo "  nothing"

      - name: Package (macOS)
        if: matrix.name == 'macos'
        run: |
          set -euo pipefail
          app=build/src/app/animage.app
          "$QT_ROOT_DIR/bin/macdeployqt" "$app"
          # macdeployqt rewrites load paths, which invalidates the linker's
          # signature. arm64 refuses to run unsigned code, so sign it again --
          # ad hoc, since this is an unidentified developer either way.
          codesign --force --deep --sign - "$app"
          mkdir -p dist
          # ditto, not zip: the frameworks inside are a web of symlinks.
          ditto -c -k --keepParent "$app" dist/Animage-macos-universal.zip

      - name: What the bundle got
        if: matrix.name == 'macos'
        run: |
          app=build/src/app/animage.app
          echo "--- size ---"
          ls -l dist/
          du -sh "$app"
          echo "--- multimedia in the bundle ---"
          find "$app" \( -iname '*multimedia*' -o -iname '*ffmpeg*' -o -iname 'libav*' \) \
            | sort || echo "  nothing"

      - name: Package (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = 'stage/Animage'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "build/src/app/$env:BUILD_TYPE/animage.exe" $stage
          Copy-Item README.md, LICENSE $stage
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations `
              --no-system-d3d-compiler --no-opengl-sw "$stage/animage.exe"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path $stage -DestinationPath dist/Animage-windows-x64.zip

      - name: What the stage got
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $stage = 'stage/Animage'
          Write-Output "--- size ---"
          Get-ChildItem dist/ | Format-Table Name, Length
          $f = Get-ChildItem -Recurse -File $stage
          "{0} files, {1:N1} MB" -f $f.Count, (($f | Measure-Object Length -Sum).Sum / 1MB)
          Write-Output "--- multimedia in the stage ---"
          $f | Where-Object { $_.Name -match 'multimedia|ffmpeg|^av|^sw' } |
            ForEach-Object { "{0,8:N2} MB  {1}" -f ($_.Length/1MB), $_.Name }

      - uses: actions/upload-artifact@v7
        with:
          name: Animage-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

      # The packaging builds above turn the sanitizers off -- a shipped binary
      # must not depend on a sanitizer runtime -- so the memory-safety story is
      # told here instead: the default build, sanitizers on, warnings as errors.
      # This is the build the README's commands produce.
  sanitize:
    name: sanitizers
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libgl1-mesa-dev libglu1-mesa-dev \
            libfontconfig1 libfreetype6 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtmultimedia
          cache: true

      # ANIMAGE_REQUIRE_SANITIZERS: see the same flag on the Windows job below.
      # A runner whose GCC stopped linking ASan would otherwise fall back to
      # UBSan alone and stay green, which is half the cover this job's name
      # claims.
      - name: Configure
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DANIMAGE_REQUIRE_SANITIZERS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The same story on Windows, as far as Windows can tell it.
  #
  # The job above runs on Linux under GCC, and two compilers do not lay memory
  # out the same way or find the same bugs -- a read one past the end of a buffer
  # is a crash or a silent wrong answer depending on what the allocator happened
  # to put there. The binaries most people download are the Windows ones, and
  # until this existed nothing had ever run them under a sanitizer at all.
  #
  # **The core library only, and that is not a compromise made to save time.**
  # MSYS2's Qt -- which is what a Windows contributor builds against, per the
  # README -- cannot link against MSVC, and MSVC is the only Windows compiler
  # with a sanitizer: GCC's runtimes have never been ported to mingw-w64, so
  # `-fsanitize=address` there is a compile that cannot link. Installing Qt for
  # MSVC purely to sanitize it would cover the widgets, which is the half of the
  # program that reads a palette and draws a rectangle, and leave the cost on
  # every run. The core is the half that owns raw memory -- tiles, the
  # compositor, transforms, the max-flow solver -- and it needs no Qt, so
  # `find_package(Qt6)` failing is what makes this job small and is left to
  # happen. `-- Qt 6 not found: building the core library and tests only`, in the
  # configure log, is this working.
  #
  # ASan and no UBSan, because MSVC has no UBSan. Undefined behaviour is still
  # the Linux job's to catch.
  sanitize-windows:
    name: sanitizers (windows, core)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      # A Developer Command Prompt, without an action to do it.
      #
      # **Issue #80.** This was `ilammy/msvc-dev-cmd@v1`, which runs on Node 20
      # -- deprecated, forced onto Node 24 by the runner with a warning, and a
      # failed step the day the forcing stops. Its last release is v1.13.0 from
      # January 2024 and `action.yml` still says `using: node20`, so waiting for
      # it was waiting for nothing. Any replacement action is the same bet again
      # on somebody else's release schedule; what the step actually does is ask
      # vswhere where Visual Studio is and run its own `VsDevCmd.bat`, which is
      # nine lines of the shell the runner already has.
      #
      # Diffed against the environment rather than dumped over it: `set` prints
      # every variable, GitHub's own included, and writing all of them back would
      # be this step rewriting the workflow's context to say what it said before
      # the batch file ran.
      - name: Developer Command Prompt (x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $root = & $vswhere -latest -products * `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -property installationPath
          if (-not $root) { throw 'no Visual Studio with the C++ tools on this runner' }
          Write-Host "Visual Studio: $root"

          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }

          cmd /c "`"$root\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 -no_logo && set" |
            ForEach-Object {
              $name, $value = $_ -split '=', 2
              if ($name -and $null -ne $value -and $before[$name] -ne $value) {
                "$name=$value" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
              }
            }

      # What the step above is for, checked rather than assumed -- because the
      # way it fails is a green build that ran no tests.
      #
      # cl.exe on PATH is the compiler CMake will pick with Ninja, and it is
      # named to CMake outright below so that a GCC left on the runner's PATH
      # cannot be chosen instead and quietly turn this into a third Linux job.
      # The DLL beside it is the other half: MSVC links AddressSanitizer
      # dynamically, so without `clang_rt.asan_dynamic-x86_64.dll` every test
      # binary dies at start-up with 0xC0000135 before printing a line.
      - name: Check the compiler and the ASan runtime are there
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cl = (Get-Command cl.exe -ErrorAction SilentlyContinue).Source
          if (-not $cl) { throw 'cl.exe is not on PATH: the Developer Command Prompt step did not take' }
          Write-Host "cl.exe: $cl"
          $asan = Join-Path (Split-Path $cl) 'clang_rt.asan_dynamic-x86_64.dll'
          if (-not (Test-Path $asan)) { throw "the ASan runtime is missing: $asan" }
          Write-Host "ASan runtime: $asan"

      # No Qt step, deliberately. See above.
      #
      # ANIMAGE_REQUIRE_SANITIZERS turns the quiet fallback into a refusal: on a
      # development machine a compiler that cannot link ASan should still build,
      # and in the job that exists to run the tests under ASan it should stop.
      - name: Configure
        env:
          CC: cl
          CXX: cl
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DANIMAGE_REQUIRE_SANITIZERS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Downloadable without a GitHub account, unlike build artifacts.
  release:
    name: publish
    needs: build
    if: github.event_name == 'push' && github.repository == 'S-poony/Animage'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish a numbered release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Animage $GITHUB_REF_NAME" --generate-notes

      - name: Move the "latest" pre-release to this commit
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/* \
            --prerelease \
            --title "Latest build of main" \
            --notes "Built from [\`${GITHUB_SHA:0:7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) on $(date -u '+%Y-%m-%d %H:%M UTC').

          This is the tip of \`main\`, not a stable release. See the README for how to open an unsigned build on macOS."
